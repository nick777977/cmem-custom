name: Fork local validation (blocked source skeleton)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validation:
    # No hosted image, checkout/setup/install/upload actions. This intentionally
    # unresolved label must not be provisioned until D12 is explicitly approved.
    runs-on: [self-hosted, Windows, cmem-D12-unapproved]
    timeout-minutes: 15
    env:
      REQUIRED_NODE: '22.23.4'
      REQUIRED_NPM: '10.9.9'
      REQUIRED_BUN: '1.4.4'
    steps:
      - name: Blocking policy preflight
        shell: pwsh
        run: |
          Write-Output 'V1 fixtures: NOT RUN; V2 typecheck/compile/generated: NOT RUN; V3 process smoke: NOT RUN; V4/V5/V6: NOT RUN'
          throw 'BLOCKED D12: approve runner, immutable workspace/artifact hashes, exact tool executables, OS process/egress boundary and retention policy before wiring commands.'
      # Reviewable stage contract (not runnable steps, no fake green):
      # V1: exact tools.bun test tests/enterprise-local/windows-09.test.ts
      #     tests/enterprise-local/compiled-smoke.test.ts, reviewed inert guard/env.
      # V2: exact tools.node node_modules/typescript/bin/tsc --noEmit;
      #     repeat -p src/ui/viewer/tsconfig.json; record baseline failures.
      #     reviewed BUILD-02 harness -> npm.cmd run build:compile ONCE;
      #     input fingerprints + generated syntax/closure checks, no lock changes.
      # V3: compiled-smoke.mjs prepareCopiedBundle/leafCases/runCase through an
      #     approved owned-tree adapter; exact generated hashes, isolated env.
      # Missing inputs fail; provisioning/runtime/live/upload are separate scope.
